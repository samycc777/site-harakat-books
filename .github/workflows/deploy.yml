# Every push to main uploads public/ to the Cloudflare Pages project kutub-mashkulah.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes wrangler@4 pages deploy public --project-name kutub-mashkulah --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Tell IndexNow (Bing, Yandex) about changed pages
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 scripts/indexnow.py changed ${{ github.event.before }} || python3 scripts/indexnow.py changed HEAD^1
