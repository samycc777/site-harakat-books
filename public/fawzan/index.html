<body>
<main>
  <header>
  <button id="theme" type="button" aria-label="الوضع الليلي" title="الوضع الليلي"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg></button>
  <a class="home" href="../">كتب مشكولة</a>
  <h1>الشيخ صالح بن فوزان الفوزان</h1>
  </header>
  <div class="bar"><input id="q" type="search" placeholder="ابحث عن كتاب" aria-label="ابحث عن كتاب" autocomplete="off"></div>
  <section>
  <div class="group top">
    <h3 class="kind">كتب <span>(٣)</span></h3>
    <ul>
    <li class="book">
      <div class="info"><h3><a href="../fawzan-al-wala-wal-bara/">الولاء والبراء في الإسلام</a></h3><span class="meta">٢٥ صفحة · <a class="src" href="https://shamela.ws/book/30005" target="_blank" rel="noopener">المصدر</a></span></div>
      <a class="btn" href="../pdf/fawzan-al-wala-wal-bara.pdf" download="الولاء والبراء في الإسلام.pdf">تحميل PDF</a>
    </li>
    <li class="book">
      <div class="info"><h3><a href="../fawzan-min-mashahir-al-mujaddidin/">من مشاهير المجددين في الإسلام</a></h3><span class="meta">٧٤ صفحة · <a class="src" href="https://shamela.ws/book/31084" target="_blank" rel="noopener">المصدر</a></span></div>
      <a class="btn" href="../pdf/fawzan-min-mashahir-al-mujaddidin.pdf" download="من مشاهير المجددين في الإسلام.pdf">تحميل PDF</a>
    </li>
    <li class="book">
      <div class="info"><h3><a href="../fawzan-sharh-al-qawaid-al-arba/">شرح القواعد الأربع</a></h3><span class="meta">٤١ صفحة · <a class="src" href="https://shamela.ws/book/11252" target="_blank" rel="noopener">المصدر</a></span></div>
      <a class="btn" href="../pdf/fawzan-sharh-al-qawaid-al-arba.pdf" download="شرح القواعد الأربع.pdf">تحميل PDF</a>
    </li>
    </ul>
  </div>
  </section>
  <p id="none" hidden>لا توجد نتائج</p>
</main>
<script>
const norm = t => t.replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
const books = [...document.querySelectorAll('.book')].map(li => [li, norm(li.querySelector('.info h3').textContent)]);
document.getElementById('q').addEventListener('input', e => {
  const words = norm(e.target.value).split(/\s+/).filter(Boolean);
  for (const [li, t] of books) li.hidden = !words.every(w => t.includes(w));
  for (const g of document.querySelectorAll('section:not(#soon) .group')) g.hidden = !g.querySelector('.book:not([hidden])');
  let any = false;
  for (const sec of document.querySelectorAll('section')) {
    if (sec.id === 'soon') { sec.hidden = words.length > 0; continue; }
    const shown = sec.querySelector('.book:not([hidden])');
    sec.hidden = !shown; any ||= !!shown;
  }
  document.getElementById('none').hidden = any;
});
</script>
</body>
